        </nav>

    <main>
        <section>
            <h2>Get In Touch</h2>

            <form>
                <label for="name">Name</label> <!-- label added, linked via for/id -->
                <input type="text" id="name" name="name" placeholder="Name" required> <!-- required = validation attribute -->

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email" required> <!-- type=email adds built-in validation -->

                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" placeholder="Phone number" pattern="[0-9]{10}"> <!-- extra input type + pattern validation -->

                <label for="date">Preferred Contact Date</label>
                <input type="date" id="date" name="date"> <!-- extra input type -->

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Message" minlength="10" required></textarea> <!-- minlength = validation attribute -->

                <button type="submit">Send</button>
            </form>
        </section>
    </main>
